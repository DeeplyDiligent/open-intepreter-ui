<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Interpreter Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        a {
            color: #90D5FF;
        }
        html {
            height: 100%;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            height: 100vh; /* Fallback */
            height: 100dvh; /* Dynamic viewport height - adjusts for keyboard */
            display: flex;
            flex-direction: column;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            min-height: 0;
        }
        
        h1 {
            color: #58a6ff;
            margin-bottom: 20px;
            font-size: 24px;
            flex-shrink: 0;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        
        .chat-container {
            flex: 1;
            min-height: 0;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        
        .message {
            display: flex;
            flex-direction: column;
            margin-bottom: 24px;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-items: flex-end;
        }

        .message.assistant {
            align-items: flex-start;
        }

        .message-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            font-size: 12px;
            color: #8b949e;
        }

        .message.user .message-meta {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: #2d1a4a;
            border: 1px solid #6e40c9;
        }

        .message.assistant .message-avatar {
            background: #112233;
            border: 1px solid #1f6feb;
        }

        .message-bubble {
            max-width: min(680px, 88%);
            border-radius: 12px;
            padding: 12px 16px;
            line-height: 1.65;
            font-size: 14px;
            word-break: break-word;
        }

        .message.user .message-bubble {
            background: #1e1038;
            border: 1px solid #6e40c9;
            border-bottom-right-radius: 4px;
            color: #e2d9f3;
        }

        .message.assistant .message-bubble {
            background: #0d1f30;
            border: 1px solid #1f6feb;
            border-bottom-left-radius: 4px;
            color: #c9d1d9;
        }

        /* Markdown content inside assistant bubbles */
        .message-bubble ul, .message-bubble ol {
            margin: 8px 0;
            padding-left: 20px;
        }

        .message-bubble li { margin: 4px 0; }

        .message-bubble p { margin: 8px 0; }
        .message-bubble p:first-child { margin-top: 0; }
        .message-bubble p:last-child  { margin-bottom: 0; }

        .message-bubble code {
            background: #0d1117;
            padding: 2px 5px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #79c0ff;
        }

        .message-bubble pre {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
            margin: 10px 0;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message-bubble pre code {
            background: none;
            padding: 0;
            color: #e6edf3;
        }

        .message-bubble table {
            border-collapse: collapse;
            width: 100%;
            margin: 12px 0;
            font-size: 13px;
        }

        .message-bubble th,
        .message-bubble td {
            padding: 7px 12px;
            text-align: left;
            border: 1px solid #30363d;
        }

        .message-bubble th {
            background: #161b22;
            font-weight: 600;
            color: #58a6ff;
            border-bottom: 2px solid #30363d;
        }

        .message-bubble tr:hover td { background: #161b22; }

        /* Spacing between interlaced blocks */
        .message.assistant .reasoning-block,
        .message.assistant .tool-block,
        .message.assistant .message-bubble {
            margin-top: 6px;
        }

        /* Tool call block */
        .tool-block {
            max-width: min(680px, 88%);
            margin-bottom: 6px;
            border-radius: 8px;
            border: 1px solid #2d3748;
            background: #0d1a2a;
            font-size: 13px;
            overflow: hidden;
        }

        .tool-block summary {
            cursor: pointer;
            padding: 7px 12px;
            font-weight: 600;
            color: #58a6ff;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
        }

        .tool-block summary::before {
            content: '▶';
            font-size: 10px;
            transition: transform 0.2s;
        }

        .tool-block[open] summary::before {
            transform: rotate(90deg);
        }

        .tool-status {
            margin-left: auto;
            font-size: 12px;
        }

        .tool-args {
            padding: 8px 12px 10px;
            border-top: 1px solid #2d3748;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #8b949e;
        }

        .tool-result {
            padding: 8px 12px 10px;
            border-top: 1px solid #2d3748;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #c9d1d9;
            background: #0a1628;
        }

        /* Reasoning / thinking block */
        .reasoning-block {
            max-width: min(680px, 88%);
            margin-bottom: 6px;
            border-radius: 8px;
            border: 1px solid #2d3748;
            background: #0d1a0d;
            font-size: 13px;
            color: #7ee787;
            overflow: hidden;
        }

        .reasoning-block summary {
            cursor: pointer;
            padding: 7px 12px;
            font-weight: 600;
            color: #56d364;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
        }

        .reasoning-block summary::before {
            content: '▶';
            font-size: 10px;
            transition: transform 0.2s;
        }

        .reasoning-block[open] summary::before {
            transform: rotate(90deg);
        }

        .reasoning-content {
            padding: 8px 12px 10px;
            border-top: 1px solid #2d3748;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.55;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #7ee787;
        }

        /* Streaming cursor */
        .streaming-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: #58a6ff;
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 0.9s step-start infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Typing indicator (dots) */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 10px 14px;
        }

        .typing-indicator span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #58a6ff;
            animation: bounce 1.2s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30%            { transform: translateY(-6px); opacity: 1; }
        }
        
        .input-container {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        
        #messageInput {
            flex: 1 !important;
            padding: 12px 16px !important;
            background: #0d1117 !important;
            border: 1px solid #30363d !important;
            border-radius: 6px !important;
            color: #c9d1d9 !important;
            font-size: 14px !important;
            line-height: 1.5 !important;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif !important;
            resize: none !important;
            overflow-y: auto !important;
            min-height: 44px !important;
            max-height: 200px !important;
        }
        
        #messageInput:focus {
            outline: none !important;
            border-color: #58a6ff !important;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1) !important;
        }
        
        #messageInput::placeholder {
            color: #6e7681 !important;
        }
        
        button {
            padding: 12px 32px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
            white-space: nowrap;
        }
        
        button:hover {
            background: #2ea043;
        }
        
        button:disabled {
            background: #30363d;
            cursor: not-allowed;
        }

        button.stop-btn {
            background: #b91c1c;
        }

        button.stop-btn:hover {
            background: #dc2626;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .status {
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 10px;
        }
        
        .status.active {
            border-color: #58a6ff;
            color: #58a6ff;
        }
        
        .settings-btn {
            padding: 8px 16px;
            background: #21262d;
        }
        
        .settings-btn:hover {
            background: #30363d;
        }

        .day-mode-btn {
            padding: 8px 16px;
            background: #21262d;
            margin-right: 8px;
        }

        .day-mode-btn:hover {
            background: #30363d;
        }

        /* Day mode overrides */
        body.day-mode {
            background: #f6f8fa;
            color: #24292f;
        }

        body.day-mode a {
            color: #0969da;
        }

        body.day-mode .chat-container {
            background: #ffffff;
            border-color: #d0d7de;
        }

        body.day-mode .message.user .message-content {
            background: #dbeafe;
            color: #1e3a5f;
        }

        body.day-mode .message.assistant .message-content {
            background: #f6f8fa;
            color: #24292f;
            border-color: #d0d7de;
        }

        body.day-mode .message.user .message-bubble {
            background: #dbeafe;
            border-color: #93c5fd;
            color: #1e3a5f;
        }

        body.day-mode .message.assistant .message-bubble {
            background: #f6f8fa;
            border-color: #d0d7de;
            color: #24292f;
        }

        body.day-mode .message-bubble code {
            background: #eaeef2;
            color: #0550ae;
        }

        body.day-mode .message-bubble pre {
            background: #eaeef2;
            border-color: #d0d7de;
        }

        body.day-mode .message-bubble pre code {
            background: none;
            color: #24292f;
        }

        body.day-mode .message-bubble th {
            background: #dde1e6;
            color: #0969da;
            border-color: #d0d7de;
        }

        body.day-mode .message-bubble th,
        body.day-mode .message-bubble td {
            border-color: #d0d7de;
        }

        body.day-mode .message-bubble tr:hover td {
            background: #eaeef2;
        }

        body.day-mode .tool-block {
            background: #f0f6ff;
            border-color: #b6d4fe;
        }

        body.day-mode .tool-block summary {
            color: #0969da;
        }

        body.day-mode .tool-args {
            border-top-color: #b6d4fe;
            color: #57606a;
        }

        body.day-mode .tool-result {
            background: #e8f0fe;
            border-top-color: #b6d4fe;
            color: #24292f;
        }

        body.day-mode .reasoning-block {
            background: #f0fdf4;
            border-color: #86efac;
            color: #166534;
        }

        body.day-mode .reasoning-block summary {
            color: #16a34a;
        }

        body.day-mode .reasoning-content {
            border-top-color: #86efac;
            color: #166534;
        }

        body.day-mode .status {
            background: #f6f8fa;
            border-color: #d0d7de;
            color: #57606a;
        }

        body.day-mode .status.active {
            border-color: #0969da;
            color: #0969da;
        }

        body.day-mode .input-container textarea,
        body.day-mode #messageInput {
            background: #ffffff !important;
            color: #24292f !important;
            border-color: #d0d7de !important;
        }

        body.day-mode .input-container textarea:focus,
        body.day-mode #messageInput:focus {
            border-color: #0969da !important;
            box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.1) !important;
        }

        body.day-mode #messageInput::placeholder {
            color: #6e7781 !important;
        }

        body.day-mode button {
            background: #0969da;
            color: #ffffff;
        }

        body.day-mode button:hover {
            background: #0860ca;
        }

        body.day-mode .settings-btn,
        body.day-mode .day-mode-btn {
            background: #eaeef2;
            color: #24292f;
        }

        body.day-mode .settings-btn:hover,
        body.day-mode .day-mode-btn:hover {
            background: #d0d7de;
        }

        body.day-mode .modal-content {
            background: #ffffff;
            border-color: #d0d7de;
            color: #24292f;
        }

        body.day-mode .modal-header {
            border-color: #d0d7de;
        }

        body.day-mode textarea.settings-input {
            background: #f6f8fa;
            color: #24292f;
            border-color: #d0d7de;
        }

        body.day-mode h1 {
            color: #0969da;
        }

        body.day-mode code,
        body.day-mode pre {
            background: #eaeef2;
            color: #24292f;
        }

        body.day-mode .tool-block code,
        body.day-mode .tool-args,
        body.day-mode .tool-result,
        body.day-mode .tool-args pre,
        body.day-mode .tool-result pre {
            background: unset;
            color: unset;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 24px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-header {
            font-size: 18px;
            font-weight: 600;
            color: #58a6ff;
            margin-bottom: 16px;
        }
        
        .modal-label {
            display: block;
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .modal textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 14px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            resize: vertical;
            margin-bottom: 16px;
        }
        
        .modal textarea:focus {
            outline: none;
            border-color: #58a6ff;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        
        .modal-buttons button {
            padding: 10px 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 DeepChat</h1>
            <div style="display:flex;align-items:center;gap:0;">
                <button class="day-mode-btn" id="dayModeBtn" onclick="toggleDayMode()">☀️ Day</button>
                <button class="settings-btn" onclick="openSettings()">⚙️ Settings</button>
            </div>
        </div>

        <div id="chatContainer" class="chat-container"></div>
        
        <div class="input-container">
            <textarea 
                id="messageInput" 
                placeholder="type your message..."
                rows="1"

            ></textarea>
            <button id="sendBtn" onclick="sendMessage()">Send</button>

        </div>
    </div>
    
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">⚙️ Custom Instructions</div>
            <label class="modal-label">Set custom instructions for the AI assistant:</label>
            <textarea id="customInstructions" placeholder="Example: You are a helpful coding assistant. Always explain your answers clearly and provide examples."></textarea>
            <div class="modal-buttons">
                <button onclick="closeSettings()">Cancel</button>
                <button onclick="saveSettings()" style="background: #238636;">Save</button>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const settingsModal = document.getElementById('settingsModal');
        const customInstructionsInput = document.getElementById('customInstructions');

        // Day mode
        function toggleDayMode() {
            const isDayMode = document.body.classList.toggle('day-mode');
            document.getElementById('dayModeBtn').textContent = isDayMode ? '🌙 Night' : '☀️ Day';
            localStorage.setItem('dayMode', isDayMode ? '1' : '0');
        }
        if (localStorage.getItem('dayMode') === '1') {
            document.body.classList.add('day-mode');
            document.addEventListener('DOMContentLoaded', () => {
                const btn = document.getElementById('dayModeBtn');
                if (btn) btn.textContent = '🌙 Night';
            });
        }
        
        let currentMessage = null;
        let currentSegmentType = null; // 'reasoning' | 'message' | null
        let currentReasoningBlock = null;
        let currentMessageBubble = null;
        let currentToolBlock = null;
        let pendingToolBlocks = []; // [{tool, element}] for parallel tool calls
        let currentText = '';
        let currentReasoningText = '';
        let currentEventSource = null;
        
        // Load custom instructions from localStorage on page load
        function loadCustomInstructions() {
            const instructions = localStorage.getItem('customInstructions') || '';
            customInstructionsInput.value = instructions;
            
            // Send to backend
            if (instructions) {
                fetch(`/set-instructions?instructions=${encodeURIComponent(instructions)}`)
                    .catch(e => console.error('Error setting instructions:', e));
            }
        }
        
        function openSettings() {
            settingsModal.classList.add('active');
        }
        
        function closeSettings() {
            settingsModal.classList.remove('active');
        }
        
        function saveSettings() {
            const instructions = customInstructionsInput.value;
            localStorage.setItem('customInstructions', instructions);
            
            // Send to backend
            fetch(`/set-instructions?instructions=${encodeURIComponent(instructions)}`)
                .then(response => response.json())
                .then(data => {
                    console.log('Instructions saved:', data);
                    closeSettings();
                })
                .catch(e => {
                    console.error('Error saving instructions:', e);
                    alert('Error saving instructions');
                });
        }
        
        // Close modal when clicking outside
        settingsModal.addEventListener('click', function(e) {
            if (e.target === settingsModal) {
                closeSettings();
            }
        });
        
        function setStopMode() {
            sendBtn.textContent = '■ Stop';
            sendBtn.classList.add('stop-btn');
            sendBtn.onclick = stopMessage;
            sendBtn.disabled = false;
        }

        function setSendMode() {
            sendBtn.textContent = 'Send';
            sendBtn.classList.remove('stop-btn');
            sendBtn.onclick = sendMessage;
            sendBtn.disabled = false;
            messageInput.disabled = false;
            messageInput.focus();
        }

        function stopMessage() {
            fetch('/stop').catch(e => console.error('Stop error:', e));
            if (currentEventSource) {
                currentEventSource.close();
                currentEventSource = null;
            }
            finalizeCurrentMessage();
            setSendMode();
        }

        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;
            
            // Display user message
            addUserMessage(message);
            
            // Clear input
            messageInput.value = '';
            messageInput.style.height = 'auto';
            
            // Switch to stop mode while processing
            setStopMode();
            messageInput.disabled = true;
            
            // Start SSE connection
            currentEventSource = new EventSource(`/chat?msg=${encodeURIComponent(message)}`);
            
            currentEventSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    handleData(data);
                } catch (e) {
                    console.error('Error parsing data:', e);
                }
            };
            
            currentEventSource.onerror = function() {
                currentEventSource.close();
                currentEventSource = null;
                finalizeCurrentMessage();
                setSendMode();
            };
        }
        
        function handleData(data) {
            if (data.type === 'message') {
                if (data.start) {
                    currentMessage = document.createElement('div');
                    currentMessage.className = 'message assistant';
                    currentMessage.innerHTML = `
                        <div class="message-meta">
                            <div class="message-avatar">🤖</div>
                            <span>Assistant</span>
                        </div>
                        <div class="typing-indicator"><span></span><span></span><span></span></div>
                    `;
                    chatContainer.appendChild(currentMessage);
                    currentSegmentType = null;
                    currentReasoningBlock = null;
                    currentMessageBubble = null;
                    currentToolBlock = null;
                    pendingToolBlocks = [];
                    currentText = '';
                    currentReasoningText = '';
                } else if (data.block_end) {
                    // A message block completed — close cursor and reset segment so next content makes a new bubble
                    if (currentMessageBubble) {
                        const cursor = currentMessageBubble.querySelector('.streaming-cursor');
                        if (cursor) cursor.remove();
                    }
                    currentSegmentType = null;
                } else if (data.content) {
                    // Remove initial typing indicator on first content
                    const typing = currentMessage.querySelector('.typing-indicator');
                    if (typing) typing.remove();

                    // Start a new message bubble if segment changed or closed
                    if (currentSegmentType !== 'message') {
                        if (currentReasoningBlock) {
                            currentReasoningBlock.removeAttribute('open');
                            currentReasoningBlock.querySelector('summary').textContent = 'Reasoning';
                        }
                        currentMessageBubble = document.createElement('div');
                        currentMessageBubble.className = 'message-bubble';
                        const contentDiv = document.createElement('div');
                        contentDiv.className = 'message-content';
                        currentMessageBubble.appendChild(contentDiv);
                        currentMessage.appendChild(currentMessageBubble);
                        currentText = '';
                        currentSegmentType = 'message';
                    }

                    currentText += data.content;
                    currentMessageBubble.querySelector('.message-content').innerHTML = marked.parse(currentText);
                    let cursor = currentMessageBubble.querySelector('.streaming-cursor');
                    if (!cursor) {
                        cursor = document.createElement('span');
                        cursor.className = 'streaming-cursor';
                        currentMessageBubble.appendChild(cursor);
                    }
                } else if (data.end) {
                    if (currentReasoningBlock) {
                        currentReasoningBlock.removeAttribute('open');
                        currentReasoningBlock.querySelector('summary').textContent = 'Reasoning';
                    }
                    if (currentMessageBubble) {
                        const cursor = currentMessageBubble.querySelector('.streaming-cursor');
                        if (cursor) cursor.remove();
                    }
                    currentMessage = null;
                    currentSegmentType = null;
                    currentReasoningBlock = null;
                    currentMessageBubble = null;
                    currentToolBlock = null;
                    pendingToolBlocks = [];
                    currentText = '';
                    currentReasoningText = '';
                    if (currentEventSource) {
                        currentEventSource.close();
                        currentEventSource = null;
                    }
                    setSendMode();
                }
            } else if (data.type === 'reasoning') {
                if (data.block_end) {
                    // Reasoning block completed — collapse it and reset segment
                    if (currentReasoningBlock) {
                        currentReasoningBlock.removeAttribute('open');
                        currentReasoningBlock.querySelector('summary').textContent = 'Reasoning';
                    }
                    currentSegmentType = null;
                } else if (data.content) {
                // Remove initial typing indicator on first content
                const typing = currentMessage && currentMessage.querySelector('.typing-indicator');
                if (typing) typing.remove();

                // Start a new reasoning block if segment changed
                if (currentSegmentType !== 'reasoning') {
                    if (currentMessageBubble) {
                        const cursor = currentMessageBubble.querySelector('.streaming-cursor');
                        if (cursor) cursor.remove();
                    }
                    currentReasoningBlock = document.createElement('details');
                    currentReasoningBlock.className = 'reasoning-block';
                    currentReasoningBlock.setAttribute('open', '');
                    currentReasoningBlock.innerHTML = `<summary>Thinking…</summary><div class="reasoning-content"></div>`;
                    currentMessage.appendChild(currentReasoningBlock);
                    currentReasoningText = '';
                    currentSegmentType = 'reasoning';
                }

                currentReasoningText += data.content;
                const rc = currentReasoningBlock.querySelector('.reasoning-content');
                rc.textContent = currentReasoningText;
                rc.scrollTop = rc.scrollHeight;
                }
            } else if (data.type === 'tool_start') {
                const typing = currentMessage && currentMessage.querySelector('.typing-indicator');
                if (typing) typing.remove();

                // Close any open cursor on current message bubble
                if (currentMessageBubble) {
                    const cursor = currentMessageBubble.querySelector('.streaming-cursor');
                    if (cursor) cursor.remove();
                }
                currentSegmentType = null;

                currentToolBlock = document.createElement('details');
                currentToolBlock.className = 'tool-block';
                currentToolBlock.setAttribute('open', '');
                const argsHtml = data.args ? `<div class="tool-args">${escapeHtml(data.args)}</div>` : '';
                currentToolBlock.innerHTML = `<summary>🔧 <code>${escapeHtml(data.tool)}</code><span class="tool-status">⏳</span></summary>${argsHtml}`;
                if (currentMessage) currentMessage.appendChild(currentToolBlock);
                pendingToolBlocks.push({tool: data.tool, id: data.id, element: currentToolBlock});
            } else if (data.type === 'tool_end') {
                const idx = data.id
                    ? pendingToolBlocks.findIndex(b => b.id === data.id)
                    : pendingToolBlocks.findIndex(b => b.tool === data.tool);
                const entry = idx !== -1 ? pendingToolBlocks.splice(idx, 1)[0] : null;
                const block = entry ? entry.element : currentToolBlock;
                if (block) {
                    const status = block.querySelector('.tool-status');
                    if (status) status.textContent = '✓';
                    if (data.result) {
                        const resultDiv = document.createElement('div');
                        resultDiv.className = 'tool-result';
                        resultDiv.textContent = data.result;
                        block.appendChild(resultDiv);
                    }
                    block.removeAttribute('open');
                }
                if (pendingToolBlocks.length === 0) currentToolBlock = null;
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function addUserMessage(message) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message user';
            msgDiv.innerHTML = `
                <div class="message-meta">
                    <div class="message-avatar">👤</div>
                    <span>You</span>
                </div>
                <div class="message-bubble">${escapeHtml(message)}</div>
            `;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function finalizeCurrentMessage() {
            if (currentReasoningBlock) {
                currentReasoningBlock.removeAttribute('open');
                currentReasoningBlock.querySelector('summary').textContent = 'Reasoning';
            }
            pendingToolBlocks.forEach(({element}) => {
                const status = element.querySelector('.tool-status');
                if (status) status.textContent = '✓';
                element.removeAttribute('open');
            });
            pendingToolBlocks = [];
            if (currentToolBlock) {
                const status = currentToolBlock.querySelector('.tool-status');
                if (status) status.textContent = '✓';
                currentToolBlock.removeAttribute('open');
                currentToolBlock = null;
            }
            if (currentMessageBubble) {
                const cursor = currentMessageBubble.querySelector('.streaming-cursor');
                if (cursor) cursor.remove();
            }
            currentMessage = null;
            currentSegmentType = null;
            currentReasoningBlock = null;
            currentMessageBubble = null;
            currentToolBlock = null;
            currentText = '';
            currentReasoningText = '';
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Handle keyboard visibility on mobile
        function updateHeight() {
            if (window.visualViewport) {
                // Check if scrolled to bottom before resize
                const wasAtBottom = chatContainer.scrollHeight - chatContainer.scrollTop <= chatContainer.clientHeight + 50;
                
                const viewport = window.visualViewport;
                document.body.style.height = viewport.height + 'px';
                
                // If was at bottom, scroll to bottom after resize
                if (wasAtBottom) {
                    setTimeout(() => {
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }, 100);
                }
            }
        }
        
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', updateHeight);
            updateHeight();
        }
        
        // Load custom instructions on page load
        loadCustomInstructions();
        
        // Focus input on load
        messageInput.focus();

        // On desktop: Shift+Enter sends, Enter adds newline; on mobile: Enter always adds newline
        const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        function handleEnterKey(e) {
            if (e.key === 'Enter') {
                if (!isMobile && e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            }
        }
        messageInput.addEventListener('keydown', handleEnterKey);
        messageInput.placeholder = isMobile
            ? 'type your message...'
            : 'type your message...';

        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });
    </script>
</body>
</html>
